<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header with Button</title>
  <style>
    

  </style>
</head>
<body>
  


  <button onclick="openfn()">
    Log workout
  </button>

  <div id="overlay" class="hidden"></div>
  <div id="workoutwindow" class="hidden">
      <p>
          Welcome to a more stylish
          GeeksforGeeks experience!
      </p>
      <button onclick="openFn()">
          Close
      </button>
  </div>
</div>


  <script>
    function openFn() {
        const over =document.getElementById("overlay");
        const popDialog =document.getElementById("popupDialog");
        over.classList.toggle("hidden");
        popDialog.classList.toggle("hidden");
        popDialog.style.opacity = popDialog.style.opacity ==="1" ? "0" : "1";
    }
</script>



</body>
</html>
