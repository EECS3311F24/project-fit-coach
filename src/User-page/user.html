<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    integrity="sha384-k6RqeWeci5ZR/Lv4MR0sA0FfDOMUybBfZZfHZp00KHq+YhZOfKJj8HT6z4FSBiD4" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha384-r4NyV5BlckV+6LuCqKMZn7b2c9zvI+BrtdXvU18h8FgrK3+N5p5VTLf0BqcT5L6" crossorigin="anonymous">

</head>
<body>

    <div class="header">
        <header>
            <span><h1>Fit Coach</h1></span>
            <i class='bx bx-user' id="header-button"></i>
        </header>
    </div>

    <div class="main-content">
        
        <!-- Calendar -->

        <div class="calendar-container">
            <div class="calender">
                <div class="head">
                    <button id="prevBtn">
                        <i class='bx bx-chevron-left'></i>
                        
                    </button>
                    <div class="monthYear" id="monthYear"></div>
                    <button id="nextBtn">
                        <i class='bx bx-chevron-right'></i>
                    </button>
                </div>
                <div class="days">
                    <div class="day">Sun</div>
                    <div class="day">Mon</div>
                    <div class="day">Tue</div>
                    <div class="day">Wed</div>
                    <div class="day">Thu</div>
                    <div class="day">Fri</div>
                    <div class="day">Sat</div>
                </div>
                <div class="dates" id="dates"></div>
            </div>

            <div class="input-fields">
                <label for="weight">Weight:</label>
                <div class="weight-input-container">
                    <input type="number" id="weight" name="weight" placeholder="Enter weight">
                    <select id="weight-unit" name="weight-unit">
                        <option value="kg">kg</option>
                        <option value="lbs">lbs</option>
                        <option value="st">st</option>
                    </select>
                </div>
            
                <label for="height">Height:</label>
                <div class="height-input-container">
                    <input type="number" id="height" name="height" placeholder="Enter height">
                    <select id="height-unit" name="height-unit">
                        <option value="cm">cm</option>
                        <option value="in">in</option>
                    </select>
                </div>
            </div>
            
            
            
        </div>


        <div class="workout-section">
            <button id="workout-btn" class="save-btn" onclick="openFn()">Log New Workout</button>
            <div id="savedWorkoutsContainer">
                <h2>Saved Workouts</h2>
                <ul id="workoutsList">
                    <!-- Saved workouts will appear here -->
                </ul>
            </div>
        </div>

        <div id="overlay"></div>
          <div id="popupDialog">
            <h1>Log here your workout</h1>
            <button class="save-btn" onclick="saveWorkout()">Save</button>
            <table class="exercise-table" id="exerciseTable">
                <thead>
                    <tr>
                        <th id="exercise-table-header">Exercise</th>
                        <th id="exercise-table-header">Reps</th>
                        <th id="exercise-table-header">Weight</th>
                    </tr>
                </thead>
                <tbody>
                    
                    <tr>
                        <td>
                            <input type="text" class="input-field" placeholder="Exercise">
                        </td>
                        <td>
                            <div class="sets-container">
                                <div class="input-group">
                                    <span>Set 1<input type="text" class="input-field" placeholder="Reps"></span>
                                </div>
                            </div>
                            <button class="add-row-btn" onclick="addSetRow(this)">Insert Set</button>
                        </td>
                        <td>
                            <div class="sets-container">
                                <div class="input-group">
                                    <input type="text" class="input-field" placeholder="Input weight in Kgs">
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <button class="add-row-btn" onclick="addExerciseRow()">Add Exercise Row</button>
            <button class="close-btn" onclick="openFn()">×</button>
          </div>
          

        
    </div>

    <div class="sidebar">
        <div class="top">
            <div class="logo">
                <span>Fit Coach</span>
            </div>
            <i class="bx bx-menu" id="btn"></i>
        </div>
        <div class="user">
            <img src="images/fitcoach.webp" alt="fitcoach" class="user-img">
            <div>
                <p class="bold">Fit Coach</p>
            </div>
        </div>
        <ul>
            <li>
                <a href="workouts.html">
                    <i class='bx bx-run'></i>
                    <span class="nav-item">Workouts</span>
                </a>
                <span class="tooltip">Workouts</span>
            </li>
            <li>
                <a href="nutrition.html">
                    <i class='bx bx-baguette'></i>
                    <span class="nav-item">Nutrition</span>
                </a>
                <span class="tooltip">Nutrition</span>
            </li>
            <li>
                <a href="TOS.html">
                    <i class='bx bx-edit-alt'></i>
                    <span class="nav-item">TOS</span>
                </a>
                <span class="tooltip">TOS</span>
            </li>
            <li>
                <a href="">
                    <i class='bx bx-book'></i>
                    <span class="nav-item">About</span>
                </a>
                <span class="tooltip">About us</span>
            </li>
        </ul>

        
    </div>

    <script src="user.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let btn = document.querySelector('#btn');
            let sidebar = document.querySelector('.sidebar');

            btn.onclick = function() {
                sidebar.classList.toggle('active');
            };
        });
    </script>
</body>
</html>
