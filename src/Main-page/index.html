<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Coach</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="nav-links">
            <a href="#">HOME</a>
            <a href="#">WORKOUTS</a>
            <a href="#">NUTRITION</a>
            <a href="#">PROFILE</a>
            <a href="#">ABOUT US</a>
        </div>
        <!-- Login/Register Button -->
        <a href="../login-page/index.html" class="login-btn">LOGIN/REGISTER</a>
        <!-- Dark Mode Toggle Button -->
        <button id="theme-toggle" class="theme-btn">Dark Mode</button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="text-content">
            <h1>Fit Coach</h1>
            <p>A huge selection of health and fitness content, healthy recipes and transformation stories to help you get fit and stay fit.</p>
            <button class="btn">Join Club Now!</button>
        </div>
        <div class="image-content">
            <img src="images/homeImage1.jpg" alt="Fitness Image">
        </div>
    </div>

    <!-- Footer -->
    <footer>
        © 2024 Fit Coach. All rights reserved.
    </footer>

    <!-- JavaScript for Theme Toggle -->
    <script>
        const themeToggleButton = document.getElementById('theme-toggle');
        themeToggleButton.textContent = 'Dark Mode';

        themeToggleButton.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            themeToggleButton.textContent = document.body.classList.contains('dark-mode') ? 'Light Mode' : 'Dark Mode';
        });
    </script>
</body>
</html>
