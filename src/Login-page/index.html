<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login And Registration Form</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
        <link rel="stylesheet" href="https://pyscript.net/releases/2024.10.2/core.css">
        <script type="module" src="https://pyscript.net/releases/2024.10.2/core.js"></script>

    </head>
    <body>

        <!-- <script type="py" src="./server.py" config="./pyscript.json"></script> -->
        <div class="hero">
            <div class="form-box">

                <!-- Logo Image -->
                <img src="images/Fit Coach Logo.jpeg" alt="Fit Coach Logo" class="logo">
                

                <!-- Register division -->
                <div class="container" id="signup" style="display: none;">
                    <h1 class="form-title">Register</h1>
                    <form method="post" action="">
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" name="fName" id="fName" placeholder="First Name" required>
                            <label for="fName">First Name</label>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" name="lName" id="lName" placeholder="Last Name" required>
                            <label for="lName">Last Name</label>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="text" name="email" id="email" placeholder="Email" required>
                            <label for="email">Email</label>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" name="password" id="password" placeholder="Password" required>
                            <label for="password">Password</label>
                        </div>

                        <input type="submit" class="btn" value="Sign Up" name="signUp">
                    </form>
                    <div class="icons">
                        <i class="fab fa-google"></i>
                    </div>

                    <div class="links">
                        <p>Already Have an Account?</p>
                        <button id="signInButton">Sign In</button>
                    </div>
                </div>

                <!-- Login division -->
                <div class="container" id="signIn">
                    <h1 class="form-title">Sign In</h1>
                    <form id="loginForm" method="post" action="/login">
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="text" name="email" id="email" placeholder="Email" required>
                            <label for="email">Email</label>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" name="password" id="password" placeholder="Password" required>
                            <label for="password">Password</label>
                        </div>
                        <p class="recover">
                            <a href="#">Recover Password</a>
                        </p>
                    
                        <input type="submit" class="btn" value="Sign In" name="signIn">
                    </form>
                    
                    <div class="icons">
                        <i class="fab fa-google"></i>
                    </div>

                    <div class="links">
                        <p>Don't have an account yet?</p>
                        <button id="signUpButton">Sign Up</button>
                    </div>
                </div>

            </div>
        </div>
        <script src="script.js"></script>
        <script>
            document.getElementById('loginForm').addEventListener('submit', function(event) {
                event.preventDefault();  // Prevent form from submitting the usual way
    
                // Collect form data
                const formData = new FormData(this);
    
                // Send data to Flask using Fetch API
                fetch('/submit', {
                    method: 'POST',
                    body: formData  // The data is automatically encoded as form data
                })
                .then(response => response.json())  // Parse the JSON response
                .then(data => {
                    alert(data.message);  // Display success message from the backend
                })
                .catch(error => {
                    console.error('Error:', error);  // Handle errors
                });
            });
        </script>
    </body>
</html>
