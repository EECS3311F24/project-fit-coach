<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login And Registration Form</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    </head>
    <body>

        <div class="hero">
            <div class="form-box">

                <!-- Logo Image -->
                <img src="images/Fit Coach Logo.jpeg" alt="Fit Coach Logo" class="logo">
                
                <!-- Header -->
                <h1 id="hero_header" style="color: white;">Fit Coach</h1>
                
                <!-- Toggle Buttons -->
                <div class="button-box">
                    <input type="radio" id="login" name="toggle" class="toggle-input" checked>
                    <label for="login" class="toggle-btn">Log In</label>

                    <input type="radio" id="register" name="toggle" class="toggle-input">
                    <label for="register" class="toggle-btn">Register</label>

                    <div id="btn"></div>
                </div>

                <!-- Register division -->
                <div class="container" id="signup">
                    <form method="post" action="">
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" name="fName" id="fName" placeholder="First Name" required>
                            <label for="fName">First Name</label>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" name="lName" id="lName" placeholder="Last Name" required>
                            <label for="lName">Last Name</label>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="text" name="email" id="email" placeholder="Email" required>
                            <label for="email">Email</label>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" name="password" id="password" placeholder="Password" required>
                            <label for="password">Password</label>
                        </div>

                        <input type="submit" class="btn" value="Sign Up" name="singUp">
                    </form>
                    <div class="icons">
                        <i class="fab fa-google"></i>
                    </div>

                    <div class="links">
                        <p>Already Have an Account?</p>
                        <button id="signInButton">Sign In</button>
                    </div>
                </div>

                <!-- Login division -->
                <div class="container" id="signIn">
                    <form method="post" action="">
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="text" name="email" id="email" placeholder="Email" required>
                            <label for="email">Email</label>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" name="password" id="password" placeholder="Password" required>
                            <label for="password">Password</label>
                        </div>
                        <p class="recover">
                            <a href="#">Recover Password</a>
                        </p>

                        <input type="submit" class="btn" value="Sign In" name="singIn">
                    </form>
                    <div class="icons">
                        <i class="fab fa-google"></i>
                    </div>

                    <div class="links">
                        <p>Don't have an account yet?</p>
                        <button id="signUpButton">Sign Up</button>
                    </div>
                </div>

            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
